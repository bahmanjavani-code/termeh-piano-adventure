plugins { id 'com.android.application' }

android {
    namespace 'com.termeh.piano'
    compileSdk 35

    buildFeatures { buildConfig true }

    defaultConfig {
        // Bazaar's RSA verification key is PUBLIC. No merchant/API private secret belongs in the APK.
        def bazaarKey = (System.getenv('TERMEH_BAZAAR_RSA_PUBLIC_KEY') ?: '').replaceAll('\\s+', '')
        if (!(bazaarKey ==~ /[A-Za-z0-9+\/=]{0,4096}/)) throw new GradleException('Invalid Bazaar public key characters')
        buildConfigField 'String', 'BAZAAR_RSA_PUBLIC_KEY', '"' + bazaarKey + '"'
        // Production content is encrypted in CI and its key is embedded ONLY
        // in that signed APK. This is limited no-host obfuscation, NOT DRM.
        def paidKey = (System.getenv('TERMEH_PREMIUM_CONTENT_KEY_HEX') ?: '').trim()
        if (paidKey && !(paidKey ==~ /[a-fA-F0-9]{64}/))
            throw new GradleException('Invalid paid-content AES key (expected 64 hex chars)')
        def paidAsset = file('src/release/assets/premium-lessons.tpk')
        def paidReady = (paidKey.length() == 64 && paidAsset.isFile() && bazaarKey.length() > 0)
        def liveRequested = System.getenv('TERMEH_ENABLE_LIVE_CHECKOUT') == '1'
        // Real charging cannot be tested before it is authorized; require a
        // SECOND explicit acknowledgment for controlled store payments.
        // This is consent to run a real payment test, NOT proof it passed.
        if (liveRequested && System.getenv('TERMEH_BAZAAR_CONTROLLED_TEST_AUTHORIZED') !=
                'I_AUTHORIZE_REAL_BAZAAR_TEST_CHARGES') {
            throw new GradleException('Refusing REAL Bazaar checkout without explicit owner authorization')
        }
        if (liveRequested && !paidReady) {
            throw new GradleException('Refusing checkout without signed Bazaar public RSA and encrypted real lessons')
        }
        buildConfigField 'String', 'PREMIUM_CONTENT_KEY_HEX', '"' + paidKey + '"'
        buildConfigField 'boolean', 'BAZAAR_CHECKOUT_ENABLED', liveRequested && paidReady ? 'true' : 'false'
        buildConfigField 'boolean', 'PAID_PACK_STAGED', paidReady ? 'true' : 'false'
        applicationId 'com.termeh.piano'
        // The public package is never modified by developer-only QA settings.
        manifestPlaceholders = [termehAppLabel: 'Termeh Piano']
        minSdk 26
        targetSdk 35
        versionCode 28
        versionName '1.3.23-beta'
    }

    signingConfigs {
        release {
            // These are populated only on the trusted CI release job.
            def store = System.getenv('TERMEH_KEYSTORE_FILE')
            if (store && System.getenv('TERMEH_KEYSTORE_PASSWORD') &&
                    System.getenv('TERMEH_KEY_ALIAS') && System.getenv('TERMEH_KEY_PASSWORD')) {
                storeFile file(store)
                storePassword System.getenv('TERMEH_KEYSTORE_PASSWORD')
                keyAlias System.getenv('TERMEH_KEY_ALIAS')
                keyPassword System.getenv('TERMEH_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            // Side-by-side installation alongside the signed child's main app.
            // Uses Android's normal debug key; can never replace production.
            applicationIdSuffix '.qa'
            versionNameSuffix '-qa'
            manifestPlaceholders = [termehAppLabel: 'Termeh Piano QA']
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

// This stage wires the official billing SDK for read-only ownership checks.
// Owner selected NO-HOST activation with limited reverse-engineering resistance.
// Real checkout and paid-content unlock remain DISABLED pending lesson and restore QA.
dependencies {
    implementation 'androidx.activity:activity:1.9.3'
    // Offline, parent-consented daily reminder; no exact alarms or backend.
    implementation 'androidx.work:work-runtime:2.10.5'
    implementation 'com.github.cafebazaar.Poolakey:poolakey:2.3.0'
}

 // Poolakey's dependency graph mixes legacy Kotlin jdk7/jdk8 artifacts with a
 // modern stdlib that already contains those classes (Gradle duplicate-class error).
 // The Kotlin 1.8+ stdlib provides the JDK compatibility classes directly.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
