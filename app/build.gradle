plugins { id 'com.android.application' }

android {
    namespace 'com.termeh.piano'
    compileSdk 35

    buildFeatures { buildConfig true }

    defaultConfig {
        // Bazaar's RSA verification key is PUBLIC. No merchant/API private secret belongs in the APK.
        def bazaarKey = (System.getenv('TERMEH_BAZAAR_RSA_PUBLIC_KEY') ?: '').replaceAll('\\s+', '')
        if (!(bazaarKey ==~ /[A-Za-z0-9+\/=]{0,4096}/)) throw new GradleException('Invalid Bazaar public key characters')
        buildConfigField 'String', 'BAZAAR_RSA_PUBLIC_KEY', '"' + bazaarKey + '"'
        applicationId 'com.termeh.piano'
        minSdk 26
        targetSdk 35
        versionCode 19
        versionName '1.3.14-beta'
    }

    signingConfigs {
        release {
            // These are populated only on the trusted CI release job.
            def store = System.getenv('TERMEH_KEYSTORE_FILE')
            if (store && System.getenv('TERMEH_KEYSTORE_PASSWORD') &&
                    System.getenv('TERMEH_KEY_ALIAS') && System.getenv('TERMEH_KEY_PASSWORD')) {
                storeFile file(store)
                storePassword System.getenv('TERMEH_KEYSTORE_PASSWORD')
                keyAlias System.getenv('TERMEH_KEY_ALIAS')
                keyPassword System.getenv('TERMEH_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        // Private, signed QA build for the creator's family device only.
        // Same package ID and approved permanent signing key preserve local
        // progress on upgrade. NEVER upload family APK to Cafe Bazaar.
        // Public commercial release still excludes the debug preview fixtures.
        family {
            initWith release
            matchingFallbacks = ['release']
            debuggable false
            signingConfig signingConfigs.release
        }
    }
    sourceSets {
        family {
            // Temporary, noncommercial complete practice materials.
            // This is NOT evidence of paid ownership or a commercial license.
            assets.srcDirs = ['src/debug/assets']
        }
    }
}

// This stage wires the official billing SDK for read-only ownership checks.
// Owner selected NO-HOST activation with limited reverse-engineering resistance.
// Real checkout and paid-content unlock remain DISABLED pending lesson and restore QA.
dependencies {
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'com.github.cafebazaar.Poolakey:poolakey:2.3.0'
}

 // Poolakey's dependency graph mixes legacy Kotlin jdk7/jdk8 artifacts with a
 // modern stdlib that already contains those classes (Gradle duplicate-class error).
 // The Kotlin 1.8+ stdlib provides the JDK compatibility classes directly.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
