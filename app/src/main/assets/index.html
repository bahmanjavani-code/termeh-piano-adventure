<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>پیانوی ترمه</title><style>
:root{font-family:Tahoma,Arial,sans-serif;color:#34305c}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#fff3c9,#f8d8f8 55%,#d4f0ff);min-height:100vh}.wrap{max-width:620px;margin:auto;padding:18px}.hero{background:#fff9;border:2px solid #fff;border-radius:28px;padding:20px;text-align:center;box-shadow:0 12px 35px #a79ad444}h1{margin:4px;font-size:27px}h2{margin:10px 0}.muted{color:#716c91;font-size:14px}.stats{display:flex;justify-content:center;gap:18px;font-weight:bold;font-size:18px;margin:12px}.tabs{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin:15px 0}button{font:inherit;border:0;border-radius:16px;padding:13px 16px;cursor:pointer;background:#fff;color:#554681;box-shadow:0 3px 0 #ddd1e9;font-weight:bold}button.active{background:#6d55cf;color:white;box-shadow:0 3px 0 #4635a0}.card{background:#fffffff0;border-radius:24px;padding:20px;box-shadow:0 9px 25px #9e8db82e;margin-top:12px;text-align:center}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:15px 0}.answers button{background:#f3edff;font-size:19px}.answers button:active{transform:translateY(2px)}#feedback{min-height:34px;font-weight:bold;color:#5945b4}svg{max-width:100%;height:auto}#shop{display:none}.shopitem{display:flex;align-items:center;justify-content:space-between;padding:12px;border-bottom:1px solid #eae2fa}.pill{display:inline-block;background:#f4e7ff;padding:8px 12px;border-radius:20px;margin:4px}.note{font-size:65px;line-height:1.4}.footer{font-size:12px;color:#807a99;margin:20px;text-align:center}</style></head><body><main class="wrap"><header class="hero"><div style="font-size:50px">👧🏻🎹🌈</div><h1>دنیای جادویی پیانوی ترمه</h1><div class="muted">هر نت درست، یک قدم به سوی ستاره‌ها!</div><div class="stats"><span id="coins">🪙 ۰</span><span id="stars">⭐ ۰</span></div></header><nav class="tabs"><button class="active" data-tab="bass">🎼 کلید فا</button><button data-tab="treble">🎵 کلید سل</button><button data-tab="rhythm">🥁 ریتم</button><button data-tab="shop">🛍️ فروشگاه</button></nav><section class="card" id="game"><h2 id="title">کلید فا</h2><p id="question">اسم این نت چیه؟</p><div id="visual"></div><div class="answers" id="answers"></div><div id="feedback" aria-live="polite"></div><button id="listen">🔊 صدای نت</button> <button id="next">🎲 سؤال بعدی</button></section><section class="card" id="shop"><h2>🛍️ فروشگاه ستاره‌ها</h2><p>با سکه‌های تمرین خرید کن!</p><div id="items"></div><div id="shopmsg"></div></section><p class="footer">نسخه آزمایشی ۱ — بدون خرید واقعی و بدون تبلیغات. تشخیص صدای پیانوی واقعی در این نسخه فعال نیست.</p></main><script>
const names=['دو','ر','می','فا','سل','لا','سی'],notes=[{name:'سل',midi:43},{name:'لا',midi:45},{name:'سی',midi:47},{name:'دو',midi:48},{name:'ر',midi:50},{name:'می',midi:52},{name:'فا',midi:53},{name:'سل',midi:55},{name:'لا',midi:57}],treble=[{name:'می',midi:64},{name:'فا',midi:65},{name:'سل',midi:67},{name:'لا',midi:69},{name:'سی',midi:71},{name:'دو',midi:72},{name:'ر',midi:74},{name:'می',midi:76},{name:'فا',midi:77}];
let tab='bass',answer='',currentMidi=60,coins=+(localStorage.getItem('termeh_coins')||0),stars=+(localStorage.getItem('termeh_stars')||0),owned=JSON.parse(localStorage.getItem('termeh_owned')||'[]'),audio;
function update(){document.getElementById('coins').textContent='🪙 '+coins;document.getElementById('stars').textContent='⭐ '+stars;localStorage.setItem('termeh_coins',coins);localStorage.setItem('termeh_stars',stars)}
function sound(midi,dur=.45){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.value=440*Math.pow(2,(midi-69)/12);g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.18,audio.currentTime+.03);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+dur);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+dur+.03)}catch(e){}}
function staff(i,clef){const y=126-i*12;let lines='';for(let j=0;j<5;j++)lines+='<line x1="25" x2="325" y1="'+(126-j*24)+'" y2="'+(126-j*24)+'" stroke="#625b91" stroke-width="2"/>';let ledger='';if(i<0)for(let k=-2;k>=i;k-=2)ledger+='<line x1="151" x2="205" y1="'+(126-k*12)+'" y2="'+(126-k*12)+'" stroke="#625b91"/>';if(i>8)for(let k=10;k<=i;k+=2)ledger+='<line x1="151" x2="205" y1="'+(126-k*12)+'" y2="'+(126-k*12)+'" stroke="#625b91"/>';return '<svg viewBox="0 0 350 170" role="img" aria-label="نت روی پنج خط حامل">'+lines+ledger+'<text x="38" y="122" font-size="73" fill="#6550a7">'+(clef==='bass'?'𝄢':'𝄞')+'</text><ellipse cx="180" cy="'+y+'" rx="16" ry="11" transform="rotate(-20 180 '+y+')" fill="#e45f9b"/><line x1="194" y1="'+y+'" x2="194" y2="'+(y-53)+'" stroke="#e45f9b" stroke-width="4"/></svg>'}
const rhythms=[{s:'♩ + ♪ + ♪',v:2},{s:'♪ + ♪',v:1},{s:'♬ + ♬',v:1},{s:'♩. + ♪',v:2},{s:'𝅗𝅥 + ♩',v:3},{s:'♩ + ♩ + ♪ + ♪',v:3},{s:'𝅝',v:4}];
function choices(correct,pool){let arr=[correct];for(const p of [...pool].sort(()=>Math.random()-.5))if(!arr.includes(p)&&arr.length<4)arr.push(p);arr.sort(()=>Math.random()-.5);document.getElementById('answers').innerHTML='';for(const val of arr){let b=document.createElement('button');b.textContent=val;b.onclick=()=>guess(val);document.getElementById('answers').appendChild(b)}}
function newQuestion(){document.getElementById('feedback').textContent='';document.getElementById('listen').style.display=tab==='rhythm'?'none':'inline-block';if(tab==='rhythm'){let r=rhythms[Math.floor(Math.random()*rhythms.length)];answer=String(r.v);document.getElementById('title').textContent='🥁 جادوی ریتم';document.getElementById('question').textContent='جمع کشش نت‌ها چند ضربِ سیاه است؟';document.getElementById('visual').innerHTML='<div class="note" dir="ltr">'+r.s+'</div>';choices(answer,['1','2','3','4'])}else{let list=tab==='bass'?notes:treble;let i=Math.floor(Math.random()*list.length);answer=list[i].name;currentMidi=list[i].midi;document.getElementById('title').textContent=tab==='bass'?'🎼 کلید فا':'🎵 کلید سل';document.getElementById('question').textContent='این نت چه اسمی دارد؟';document.getElementById('visual').innerHTML=staff(i,tab);choices(answer,names)}}
function guess(val){let f=document.getElementById('feedback');if(val===answer){coins+=10;stars++;update();f.textContent='🌟 آفرین ترمه! ۱۰ سکه گرفتی!';sound(currentMidi);document.querySelectorAll('#answers button').forEach(b=>b.disabled=true)}else{f.textContent='💜 یه بار دیگه امتحان کن!'}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;document.getElementById('game').style.display=tab==='shop'?'none':'block';document.getElementById('shop').style.display=tab==='shop'?'block':'none';if(tab==='shop')renderShop();else newQuestion()});
document.getElementById('listen').onclick=()=>sound(currentMidi,.7);document.getElementById('next').onclick=newQuestion;
const goods=[['🐱','گربه موزیسین',30],['👑','تاج ستاره‌ای',50],['🎀','پاپیون صورتی',20],['🌈','رنگین‌کمان جادویی',80]];
function renderShop(){document.getElementById('items').innerHTML='';for(const [emoji,name,price] of goods){let row=document.createElement('div');row.className='shopitem';let label=document.createElement('span');label.textContent=emoji+' '+name;let btn=document.createElement('button');btn.textContent=owned.includes(name)?'خریداری شده':'🪙 '+price;btn.disabled=owned.includes(name);btn.onclick=()=>{if(coins<price){document.getElementById('shopmsg').textContent='سکه‌هات کمه! بیشتر تمرین کن 🌟';return}coins-=price;owned.push(name);localStorage.setItem('termeh_owned',JSON.stringify(owned));update();renderShop();document.getElementById('shopmsg').textContent='🎉 مبارکه! '+name+' مال تو شد!'};row.append(label,btn);document.getElementById('items').appendChild(row)}}
update();newQuestion();
</script></body></html>
