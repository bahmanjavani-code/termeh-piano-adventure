name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # RSA verification key is public (not a merchant secret). Empty means billing disabled.
      TERMEH_BAZAAR_RSA_PUBLIC_KEY: ${{ vars.TERMEH_BAZAAR_RSA_PUBLIC_KEY }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test safe signing-key handling with a disposable key
        run: bash tests/release-signing.test.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Validate music theory, privacy, and JavaScript syntax
        run: node tests/quality.test.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify AES-GCM premium content-pack prototype (developer tooling only)
        run: node tests/secure-premium-pack.test.cjs
      - name: Test safe offline premium entitlement core (mocks only, never charge)
        run: node tests/secure-activation.test.cjs
      - name: Guard serverless purchase flow until paid content and restore QA are ready
        run: node tests/no-host-billing-guard.test.cjs
      - name: Verify encrypted offline demo lesson fixture and AES-GCM tamper detection
        run: node tests/encrypted-apk-demo.test.cjs
      - name: Check Bazaar public RSA format without revealing value
        run: node tests/bazaar-public-key.test.cjs
      - name: Build debug APK with runner Android SDK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify premium lesson previews are debug-only
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          unzip -p "$APK" assets/premium-preview.js | grep -q 'debug-full-preview'
          unzip -p "$APK" assets/premium-preview.js | grep -q 'trebleExtra'
          # Make Gradle merge release assets without creating or signing a release APK.
          gradle --no-daemon :app:mergeReleaseAssets
          RELEASE_ASSET="$(find app/build/intermediates -type f -path '*/release/*' -name 'premium-preview.js' | head -1)"
          test -n "$RELEASE_ASSET"
          grep -q 'release-free' "$RELEASE_ASSET"
          if grep -Eq '(trebleExtra|debug-full-preview|beatsLabel)' "$RELEASE_ASSET"; then
            echo "::error::Paid beta lessons leaked into release assets"
            exit 1
          fi
          echo "Release APK assets will not contain test-only premium lessons."
      - name: QA build full release variant with disposable test key (never publish)
        shell: bash
        run: |
          set -euo pipefail
          TEST_KEY="$RUNNER_TEMP/termeh-QA-DISPOSABLE-DO-NOT-PUBLISH.p12"
          cleanup() {
            rm -f "$TEST_KEY"
            rm -f app/build/outputs/apk/release/app-release.apk
          }
          trap cleanup EXIT
          keytool -genkeypair -noprompt -storetype PKCS12 \
            -keystore "$TEST_KEY" -storepass test-qa-only-password-123456 \
            -alias termeh_ci_disposable -keypass test-qa-only-password-123456 \
            -keyalg RSA -keysize 3072 -validity 10000 \
            -dname "CN=Disposable QA Key, O=Termeh QA, C=IR" >/dev/null 2>&1
          TERMEH_KEYSTORE_FILE="$TEST_KEY" \
          TERMEH_KEYSTORE_PASSWORD=test-qa-only-password-123456 \
          TERMEH_KEY_ALIAS=termeh_ci_disposable \
          TERMEH_KEY_PASSWORD=test-qa-only-password-123456 \
            gradle --no-daemon :app:assembleRelease
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          AAPT="$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify "$APK"
          unzip -p "$APK" assets/premium-preview.js | grep -q 'release-free'
          if unzip -p "$APK" assets/premium-preview.js | grep -Eq '(trebleExtra|debug-full-preview|beatsLabel)'; then
            echo "::error::Debug lessons leaked into release QA artifact"
            exit 1
          fi
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.termeh.piano'"
          echo "PASS: production variant builds/signs with disposable CI-only QA key."
          echo "IMPORTANT: this disposable key and QA release APK are deleted, never uploaded."
      - name: Verify final APK has no camera, microphone or location permissions
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)"
          test -x "$AAPT"
          "$AAPT" dump permissions app/build/outputs/apk/debug/app-debug.apk | tee /tmp/termeh-permissions.txt
          if grep -Ei 'android.permission.(RECORD_AUDIO|CAMERA|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|ACCESS_BACKGROUND_LOCATION|ACCESS_MEDIA_LOCATION|LOCATION_HARDWARE)' /tmp/termeh-permissions.txt; then
            echo "::error::Privacy check failed: forbidden permission in final APK"
            exit 1
          fi
          echo "Privacy check passed: no microphone, camera or location permissions."
      - name: Confirm APK exists before upload
        shell: bash
        run: |
          set -euo pipefail
          ls -lh app/build/outputs/apk/debug/
          test -s app/build/outputs/apk/debug/app-debug.apk
          echo 'APK exists and is nonempty.'
      - name: Upload installable APK
        id: apk_upload
        uses: actions/upload-artifact@v4
        with:
          name: Termeh-Piano-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Show APK artifact download link
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.apk_upload.outputs.artifact-url }}
          ARTIFACT_ID: ${{ steps.apk_upload.outputs.artifact-id }}
        run: |
          set -euo pipefail
          if [ -z "$ARTIFACT_URL" ] || [ -z "$ARTIFACT_ID" ]; then
            echo '::error::Artifact upload returned no artifact URL or ID.'
            exit 1
          fi
          echo "### Download the Android APK" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download Termeh-Piano-APK]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact ID: $ARTIFACT_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "APK artifact uploaded: $ARTIFACT_URL"
      - name: Install browser smoke-test runner
        run: npm install --no-save --ignore-scripts playwright-core@1.56.1
      - name: Exercise offline app in headless Chrome
        run: node tests/browser-smoke.cjs
