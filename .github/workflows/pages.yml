name: Publish Termeh Piano website
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "termeh-pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check bilingual pages and privacy documents
        run: |
          test -s docs/index.html
          test -s docs/en/index.html
          test -s docs/privacy.html
          test -s docs/en/privacy.html
          test -s docs/styles.css
          grep -q 'Termeh Piano' docs/index.html
          grep -q 'Privacy Policy' docs/en/privacy.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy official website
        id: deployment
        uses: actions/deploy-pages@v4
