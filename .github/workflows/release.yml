name: Build signed release candidate (no checkout on push)
on:
  # Produce a permanently signed NONCHARGEABLE candidate after each green
  # main update. Never submit the artifact to Bazaar automatically.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      allow_controlled_real_checkout:
        description: 'I understand a real Bazaar test may charge 990,000 IRR; DO NOT publish'
        type: boolean
        default: false
        required: true
      owner_payment_acknowledgement:
        description: 'For REAL payment tests ONLY, type I_AUTHORIZE_REAL_BAZAAR_TEST_CHARGES'
        type: string
        default: ''
        required: false
jobs:
  signed-release:
    runs-on: ubuntu-latest
    env:
      # RSA verification key is public (not a merchant secret). Empty means billing disabled.
      TERMEH_BAZAAR_RSA_PUBLIC_KEY: ${{ vars.TERMEH_BAZAAR_RSA_PUBLIC_KEY }}
      TERMEH_REQUIRE_BAZAAR_RSA_KEY: '0'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test safe signing-key handling with a disposable key
        run: bash tests/release-signing.test.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run music theory and privacy checks
        run: node tests/quality.test.cjs
      - name: Verify public 1.0.0 final version, progress-safe updates and Bazaar controls
        run: node tests/final-release-guard.test.cjs
      - name: Validate signed release workflow is safe and syntactically sound
        run: node tests/signed-workflow-guard.test.cjs
      - name: Guard previously owned Bazaar restore, refund ordering and real test certificate
        run: node tests/merchant-restore-readiness.test.cjs
      - name: Test long-term note mastery, adaptive drill and balanced final assessment
        run: node tests/mastery-engine.test.cjs
      - name: Test stepwise note curriculum and retention of old notes
        run: node tests/note-curriculum.test.cjs
      - name: Test rhythmic meter arithmetic and compound 6/8
        run: node tests/meter-engine.test.cjs
      - name: Test parent-consented daily notification scheduler and free lesson packaging
        run: node tests/daily-reminder.test.cjs
      - name: Test cosmetic economy and avoid easy trophy farming
        run: node tests/rewards-economy.test.cjs
      - name: Verify AES-GCM premium content-pack prototype (developer tooling only)
        run: node tests/secure-premium-pack.test.cjs
      - name: Test secure lifetime content staging (disposable AES, no purchase)
        run: node tests/staged-bazaar-premium.test.cjs
      - name: Test safe offline premium entitlement core (mocks only, never charge)
        run: node tests/secure-activation.test.cjs
      - name: Guard serverless purchase flow until paid content and restore QA are ready
        run: node tests/no-host-billing-guard.test.cjs
      - name: Verify encrypted offline demo lesson fixture and AES-GCM tamper detection
        run: node tests/encrypted-apk-demo.test.cjs
      - name: Check isolated Android Keystore entitlement vault (no payment)
        run: node tests/offline-keystore-vault.test.cjs
      - name: Validate no-charge Bazaar restore path and fail-closed local license caching
        run: node tests/bazaar-restore-guard.test.cjs
      - name: Run UI smoke tests
        run: |
          npm install --no-save --ignore-scripts playwright-core@1.56.1
          node tests/browser-smoke.cjs
      - name: Check Bazaar public RSA format without revealing value
        run: node tests/bazaar-public-key.test.cjs
      - name: Configure secret signing material
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TERMEH_KEYSTORE_BASE64 }}
          TERMEH_KEYSTORE_PASSWORD: ${{ secrets.TERMEH_KEYSTORE_PASSWORD }}
          TERMEH_KEY_ALIAS: ${{ secrets.TERMEH_KEY_ALIAS }}
          TERMEH_KEY_PASSWORD: ${{ secrets.TERMEH_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in "$KEYSTORE_BASE64" "$TERMEH_KEYSTORE_PASSWORD" "$TERMEH_KEY_ALIAS" "$TERMEH_KEY_PASSWORD"; do
            if [ -z "$value" ]; then
              echo "::error::Release signing secrets are not configured in repository Settings > Secrets and variables > Actions"
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/termeh-release.jks"
          chmod 600 "$RUNNER_TEMP/termeh-release.jks"
          echo "TERMEH_KEYSTORE_FILE=$RUNNER_TEMP/termeh-release.jks" >> "$GITHUB_ENV"
      - name: Verify original release key and certificate identity
        id: signing_cert
        shell: bash
        env:
          TERMEH_KEYSTORE_PASSWORD: ${{ secrets.TERMEH_KEYSTORE_PASSWORD }}
          TERMEH_KEY_ALIAS: ${{ secrets.TERMEH_KEY_ALIAS }}
          TERMEH_RELEASE_CERT_SHA256: ${{ vars.TERMEH_RELEASE_CERT_SHA256 }}
          CONTROLLED_CHECKOUT_REQUESTED: ${{ (github.event_name == 'workflow_dispatch' && inputs.allow_controlled_real_checkout && inputs.owner_payment_acknowledgement == 'I_AUTHORIZE_REAL_BAZAAR_TEST_CHARGES' || github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before == '85ea04b2ec36e242270c019a7ed1cd8680ee3865' && startsWith(github.event.head_commit.message, 'owner-authorized-1.0.2-controlled-sale-apk')) && '1' || '0' }}
        run: |
          set -euo pipefail
          if [ "$CONTROLLED_CHECKOUT_REQUESTED" = '1' ] && [ -z "$TERMEH_RELEASE_CERT_SHA256" ]; then
            echo "::error::Controlled monetary tests must pin the ORIGINAL release certificate first."
            exit 1
          fi
          FINGERPRINT="$(bash tools/check-release-key.sh)"
          echo "sha256=$FINGERPRINT" >> "$GITHUB_OUTPUT"
          echo "### Termeh Piano release certificate" >> "$GITHUB_STEP_SUMMARY"
          echo "Public SHA-256 fingerprint: \`$FINGERPRINT\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$TERMEH_RELEASE_CERT_SHA256" ]; then
            echo "::warning::First signing run: set repository variable TERMEH_RELEASE_CERT_SHA256 to the fingerprint above before future updates."
          fi
      - name: Show safe merchant setup readiness
        shell: bash
        env:
          MERCHANT_PUBLIC_RSA: ${{ vars.TERMEH_BAZAAR_RSA_PUBLIC_KEY }}
          ORIGINAL_CERT_PIN: ${{ vars.TERMEH_RELEASE_CERT_SHA256 }}
          CHECKOUT_FLAG: ${{ (github.event_name == 'workflow_dispatch' && inputs.allow_controlled_real_checkout && inputs.owner_payment_acknowledgement == 'I_AUTHORIZE_REAL_BAZAAR_TEST_CHARGES' || github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before == '85ea04b2ec36e242270c019a7ed1cd8680ee3865' && startsWith(github.event.head_commit.message, 'owner-authorized-1.0.2-controlled-sale-apk')) && '1' || '0' }}
          OWNER_AUTHORIZATION: ${{ (github.event_name == 'workflow_dispatch' && inputs.allow_controlled_real_checkout && inputs.owner_payment_acknowledgement == 'I_AUTHORIZE_REAL_BAZAAR_TEST_CHARGES' || github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before == '85ea04b2ec36e242270c019a7ed1cd8680ee3865' && startsWith(github.event.head_commit.message, 'owner-authorized-1.0.2-controlled-sale-apk')) && 'I_AUTHORIZE_REAL_BAZAAR_TEST_CHARGES' || '' }}
        run: |
          set -euo pipefail
          echo "### Cafe Bazaar controlled payment readiness" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$MERCHANT_PUBLIC_RSA" ]; then
            echo "Merchant RSA public key: configured" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Merchant RSA public key: missing" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$ORIGINAL_CERT_PIN" ]; then
            echo "Original signing certificate pin: configured" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Original signing certificate pin: missing" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "AES lesson packaging: automatic per signed build (no extra secret required)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$CHECKOUT_FLAG" = '1' ] && [ "$OWNER_AUTHORIZATION" = 'I_AUTHORIZE_REAL_BAZAAR_TEST_CHARGES' ]; then
            echo "New checkout: controlled live test requested" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "New checkout: OFF - safe signed QA" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Stage AES-GCM paid curriculum using private or ephemeral build key
        shell: bash
        env:
          PROVISIONED_CONTENT_KEY: ${{ secrets.TERMEH_PREMIUM_CONTENT_KEY_HEX }}
        run: |
          set -euo pipefail
          # Offline content encryption is tied to this signed APK build, not to
          # a permanent user account. A random per-build key is sufficient:
          # validated owner state lives separately in Android Keystore.
          # It is not true DRM: the decryption key exists in the installed APK.
          if [ -n "$PROVISIONED_CONTENT_KEY" ]; then
            CONTENT_KEY="$PROVISIONED_CONTENT_KEY"
          else
            CONTENT_KEY="$(openssl rand -hex 32)"
          fi
          if ! [[ "$CONTENT_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::Invalid AES build key; refusing to produce a signed APK."
            exit 1
          fi
          echo "::add-mask::$CONTENT_KEY"
          TERMEH_PREMIUM_CONTENT_KEY_HEX="$CONTENT_KEY" node tools/stage-bazaar-premium.cjs
          # GITHUB_ENV belongs to this ephemeral CI job. Never print this line
          # to logs, store it in the repo, nor send it to the WebView.
          printf 'TERMEH_PREMIUM_CONTENT_KEY_HEX=%s\n' "$CONTENT_KEY" >> "$GITHUB_ENV"
          echo "Authenticated lifetime curriculum staged; plaintext is not packaged."
          unset CONTENT_KEY PROVISIONED_CONTENT_KEY
      - name: Build release APK using signed keystore
        env:
          TERMEH_KEYSTORE_PASSWORD: ${{ secrets.TERMEH_KEYSTORE_PASSWORD }}
          TERMEH_KEY_ALIAS: ${{ secrets.TERMEH_KEY_ALIAS }}
          TERMEH_KEY_PASSWORD: ${{ secrets.TERMEH_KEY_PASSWORD }}
          TERMEH_ENABLE_LIVE_CHECKOUT: ${{ (github.event_name == 'workflow_dispatch' && inputs.allow_controlled_real_checkout && inputs.owner_payment_acknowledgement == 'I_AUTHORIZE_REAL_BAZAAR_TEST_CHARGES' || github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before == '85ea04b2ec36e242270c019a7ed1cd8680ee3865' && startsWith(github.event.head_commit.message, 'owner-authorized-1.0.2-controlled-sale-apk')) && '1' || '0' }}
          TERMEH_BAZAAR_CONTROLLED_TEST_AUTHORIZED: ${{ (github.event_name == 'workflow_dispatch' && inputs.allow_controlled_real_checkout && inputs.owner_payment_acknowledgement == 'I_AUTHORIZE_REAL_BAZAAR_TEST_CHARGES' || github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before == '85ea04b2ec36e242270c019a7ed1cd8680ee3865' && startsWith(github.event.head_commit.message, 'owner-authorized-1.0.2-controlled-sale-apk')) && 'I_AUTHORIZE_REAL_BAZAAR_TEST_CHARGES' || '' }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Validate payment capability in built release without starting any payment
        shell: bash
        env:
          EXPECTED_CHECKOUT: ${{ (github.event_name == 'workflow_dispatch' && inputs.allow_controlled_real_checkout && inputs.owner_payment_acknowledgement == 'I_AUTHORIZE_REAL_BAZAAR_TEST_CHARGES' || github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before == '85ea04b2ec36e242270c019a7ed1cd8680ee3865' && startsWith(github.event.head_commit.message, 'owner-authorized-1.0.2-controlled-sale-apk')) && '1' || '0' }}
        run: |
          set -euo pipefail
          BUILDCONFIG="app/build/generated/source/buildConfig/release/com/termeh/piano/BuildConfig.java"
          test -s "$BUILDCONFIG"
          if [ "$EXPECTED_CHECKOUT" = '1' ]; then
            grep -Eq 'BAZAAR_CHECKOUT_ENABLED = true;' "$BUILDCONFIG"
            grep -Eq 'PAID_PACK_STAGED = true;' "$BUILDCONFIG"
            echo "Controlled real-payment capability compiled; actual charging still requires a separate parent action inside Bazaar." >> "$GITHUB_STEP_SUMMARY"
          else
            grep -Eq 'BAZAAR_CHECKOUT_ENABLED = false;' "$BUILDCONFIG"
            echo "No-payment build; checkout compiled OFF." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Verify APK signature, Android target, and privacy
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          # Never publish beta-only advanced lesson fixtures inside a commercial APK.
          # QA only: encrypted noncommercial demo must be packed without plaintext.
          unzip -p "$APK" assets/premium-demo-pack.json | grep -q '"ciphertext"'
          if unzip -p "$APK" assets/premium-demo-pack.json | grep -q 'encrypted_demo_only'; then
            echo "::error::Demo lesson plaintext leaked into APK pack"
            exit 1
          fi
          unzip -p "$APK" assets/premium-preview.js | grep -q 'release-free'
          # Paid curriculum is optional until merchant readiness. When staged,
          # it MUST be encrypted and contain no literal lesson records.
          if unzip -Z1 "$APK" | grep -q '^assets/premium-lessons[.]tpk$'; then
            unzip -p "$APK" assets/premium-lessons.tpk | grep -q '"ciphertext"'
            if unzip -p "$APK" assets/premium-lessons.tpk | grep -Eq '(trebleExtra|beatsLabel|hintText)'; then
              echo "::error::Paid lesson definitions must never be plaintext in signed APK"
              exit 1
            fi
          fi
          if unzip -p "$APK" assets/premium-preview.js | grep -Eq '(debug-full-preview|trebleExtra|beatsLabel)'; then
            echo "::error::Premium debug lesson content is bundled in release APK"
            exit 1
          fi
          AAPT="$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          # Accept either 'Signer #1 certificate ...' or 'V2 Signer: certificate ...'.
          ACTUAL_CERT="$("$APKSIGNER" verify --print-certs "$APK" | awk '/certificate SHA-256 digest:/ {print $NF; exit}' | tr 'A-F' 'a-f' | tr -d '[:space:]')"
          if ! [[ "$ACTUAL_CERT" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Could not read SHA-256 signing certificate digest from APK"
            exit 1
          fi
          EXPECTED_CERT="${{ steps.signing_cert.outputs.sha256 }}"
          if [ "$ACTUAL_CERT" != "$EXPECTED_CERT" ]; then
            echo "::error::APK signature does not match the approved release signing key"
            exit 1
          fi
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.termeh.piano'"
          if "$AAPT" dump badging "$APK" | grep -q 'application-debuggable'; then
            echo "::error::Release APK must never be debuggable"
            exit 1
          fi
          "$AAPT" dump badging "$APK" | grep 'targetSdkVersion:' | tee /tmp/termeh-target.txt
          grep -q "targetSdkVersion:'35'" /tmp/termeh-target.txt
          "$AAPT" dump permissions "$APK" | tee /tmp/termeh-permissions.txt
          if grep -Ei 'android.permission.(RECORD_AUDIO|CAMERA|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|ACCESS_BACKGROUND_LOCATION|ACCESS_MEDIA_LOCATION|LOCATION_HARDWARE)' /tmp/termeh-permissions.txt; then
            echo "::error::Sensitive permission found in signed release APK"
            exit 1
          fi
      - name: Upload signed APK for controlled review
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ (github.event_name == 'workflow_dispatch' && inputs.allow_controlled_real_checkout && inputs.owner_payment_acknowledgement == 'I_AUTHORIZE_REAL_BAZAAR_TEST_CHARGES' || github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before == '85ea04b2ec36e242270c019a7ed1cd8680ee3865' && startsWith(github.event.head_commit.message, 'owner-authorized-1.0.2-controlled-sale-apk')) && 'Termeh-Piano-CONTROLLED-REAL-PAYMENT-TEST-DO-NOT-PUBLISH' || 'Termeh-Piano-SIGNED-QA-CANDIDATE-DO-NOT-PUBLISH' }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Display artifact link
        env:
          URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          echo "### Signed candidate — DO NOT PUBLISH until merchant purchase, restore and refund QA pass" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download signed test candidate]($URL)" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary signing and paid-content material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/termeh-release.jks"
          rm -f app/src/release/assets/premium-lessons.tpk
